name: ${COMPOSE_PROJECT_NAME:-local-ai}

services:
  llm-server:
    image: ${LLAMA_CPP_IMAGE:-ghcr.io/ggml-org/llama.cpp@sha256:b5e13ddfaa3df76d239ee038075960a46f595201808728fd70bbf2c8b38f6530}
    restart: unless-stopped
    gpus: all
    command:
      - "--model"
      - "/models/${MODEL_GGUF_FILE:?MODEL_GGUF_FILE must be set in .env}"
      - "--mmproj"
      - "/models/${MODEL_MMPROJ_FILE:?MODEL_MMPROJ_FILE must be set in .env}"
      - "--alias"
      - "${MODEL_API_ID:?MODEL_API_ID must be set in .env}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "${LLM_SERVER_PORT:-8080}"
      - "--ctx-size"
      - "${MODEL_CONTEXT_SIZE:-32768}"
      - "--parallel"
      - "${MODEL_PARALLEL:-1}"
      - "--gpu-layers"
      - "${MODEL_GPU_LAYERS:-auto}"
      - "--flash-attn"
      - "on"
      - "--cache-type-k"
      - "${MODEL_KV_CACHE_TYPE:-q4_0}"
      - "--cache-type-v"
      - "${MODEL_KV_CACHE_TYPE:-q4_0}"
      - "--image-min-tokens"
      - "${MODEL_IMAGE_MIN_TOKENS:-1024}"
      - "--jinja"
      - "--reasoning"
      - "auto"
      - "--reasoning-format"
      - "deepseek"
      - "--spec-type"
      - "${MODEL_SPECULATIVE_TYPE:-none}"
      - "--spec-draft-n-max"
      - "${MODEL_SPECULATIVE_TOKENS:-0}"
    volumes:
      - ./.model-cache:/models:ro
    healthcheck:
      test: ["CMD-SHELL", "curl --silent --fail http://localhost:${LLM_SERVER_PORT:-8080}/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 3m

  open-webui:
    image: ${OPEN_WEBUI_IMAGE:-ghcr.io/open-webui/open-webui@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f}
    restart: unless-stopped
    command: ["bash", "/opt/local-ai/start-with-bootstrap.sh"]
    ports:
      - "127.0.0.1:${WEBUI_PORT:-3000}:8080"
    environment:
      WEBUI_AUTH: "${WEBUI_AUTH:-true}"
      WEBUI_SECRET_KEY: "${WEBUI_SECRET_KEY:?WEBUI_SECRET_KEY must be set in .env}"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_OLLAMA_API: "false"
      OPENAI_API_KEY: "not-needed"
      OPENAI_API_BASE_URL: "http://llm-server:${LLM_SERVER_PORT:-8080}/v1"
      DEFAULT_MODELS: "${MODEL_API_ID:?MODEL_API_ID must be set in .env}"
      MODEL_API_ID: "${MODEL_API_ID:?MODEL_API_ID must be set in .env}"
      MODEL_DISPLAY_NAME: "${MODEL_DISPLAY_NAME:?MODEL_DISPLAY_NAME must be set in .env}"
      MODEL_VISION: "true"
      OPEN_WEBUI_FILTER_ID: "reasoning_effort_selector"
      ENABLE_CONTEXT_COMPACTION: "${CONTEXT_COMPACTION_ENABLED:-true}"
      # Leave room for large MCP tool schemas, Russian text (which Open WebUI's
      # character-based estimate undercounts), and the model's response.
      CONTEXT_COMPACTION_TOKEN_THRESHOLD: "${CONTEXT_COMPACTION_TOKEN_THRESHOLD:-16000}"
      CONTEXT_COMPACTION_TOKEN_CAP: "${CONTEXT_COMPACTION_TOKEN_CAP:-16000}"
      CONTEXT_COMPACTION_RETENTION_PERCENTAGE: "${CONTEXT_COMPACTION_RETENTION_PERCENTAGE:-25}"
      TOOL_SERVER_CONNECTIONS: >-
        [{"type":"mcp","url":"http://host.docker.internal:${CHROME_DEVTOOLS_MCP_PORT:-8933}/mcp","path":"/mcp","auth_type":"none","key":"","config":{"enable":true,"access_grants":[]},"info":{"id":"chrome-devtools","name":"Chrome","description":"Control and inspect every open tab and window in the dedicated Agent Chrome profile."}},{"type":"mcp","url":"http://host.docker.internal:${COMPUTER_USE_MCP_PORT:-8932}/mcp","path":"/mcp","auth_type":"none","key":"","config":{"enable":true,"access_grants":[]},"info":{"id":"computer-use","name":"Computer","description":"Windows desktop automation via UI Automation, screenshots, mouse and keyboard, with access to configured filesystem roots."}}]
      TERMINAL_SERVER_CONNECTIONS: >-
        [{"id":"projects-terminal","url":"http://open-terminal:8000","key":"${OPEN_TERMINAL_API_KEY:?OPEN_TERMINAL_API_KEY must be set in .env}","name":"Projects Terminal","auth_type":"bearer","config":{"access_grants":[]}}]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui-data:/app/backend/data
      - ./open-webui:/opt/local-ai:ro
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/local-ai-open-webui-ready && curl --silent --fail http://localhost:$${PORT:-8080}/health | jq -ne 'input.status == true' || exit 1"]
    depends_on:
      llm-server:
        condition: service_healthy
      open-terminal:
        condition: service_started

  open-terminal:
    image: ${OPEN_TERMINAL_IMAGE:-ghcr.io/open-webui/open-terminal@sha256:8df3a502a5d35435547d037fa50b5f55323fc5fd0e1b97d2d3d2b5cb42538452}
    restart: unless-stopped
    working_dir: /home/user/workspace
    environment:
      OPEN_TERMINAL_API_KEY: "${OPEN_TERMINAL_API_KEY:?OPEN_TERMINAL_API_KEY must be set in .env}"
    volumes:
      - "${PROJECTS_DIR:-./projects}:/home/user/workspace:rw"

volumes:
  open-webui-data:
    name: ${WEBUI_DATA_VOLUME:-local-ai-open-webui-data}
